version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      frontend-toolchain:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "typescript"
          - "vitest"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /crates/horizon-engine
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
