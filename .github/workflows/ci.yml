name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.7
          cache: true
      - run: gofmt -w api cmd pulse
      - run: git diff --exit-code -- api cmd pulse
      - run: go vet ./...
      - run: go test -race ./...

  rust-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action; compiler pinned below
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path crates/horizon-engine/Cargo.toml --all -- --check
      - run: cargo test --manifest-path crates/horizon-engine/Cargo.toml
      - run: cargo clippy --manifest-path crates/horizon-engine/Cargo.toml --all-targets -- -D warnings
      - name: Install wasm-pack
        run: |
          curl --proto '=https' --tlsv1.2 -L --fail --silent --show-error \
            https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            -o /tmp/wasm-pack.tar.gz
          echo "c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a  /tmp/wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo install /tmp/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack
      - run: npm run build:wasm
      - run: git diff --exit-code -- crates/horizon-engine/Cargo.lock src/generated/horizon-engine
