name: Frontier parity

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  oj-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/oj
          key: ${{ runner.os }}-oj-0.1.11
      - run: npm ci
      - name: Install pinned oj
        run: command -v oj >/dev/null || cargo install oj --version 0.1.11 --locked
      - name: Build canonical Vite output
        run: npm run build
      - name: Build oj parity output
        run: |
          started=$(date +%s%3N)
          npm run build:oj
          finished=$(date +%s%3N)
          echo "OJ_BUILD_MS=$((finished-started))" >> "$GITHUB_ENV"
      - run: npm run verify:oj
      - name: Publish parity summary
        run: |
          echo "### oj 0.1.11 parity" >> "$GITHUB_STEP_SUMMARY"
          echo "Build completed in ${OJ_BUILD_MS} ms." >> "$GITHUB_STEP_SUMMARY"
          echo "Verified root, EN, UK, referenced assets, three worker entrypoints, and a valid Wasm artifact." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: oj-parity-${{ github.sha }}
          path: dist-oj
          retention-days: 7
