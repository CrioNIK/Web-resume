[package]
name = "horizon-rust-normalizer"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Pure Rust normalization component for the Horizon Component Mesh"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "=0.61.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
