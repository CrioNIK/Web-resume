[package]
name = "horizon-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Deterministic browser compute primitives for the Horizon portfolio experience"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.128"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Binaryen currently rejects the bulk-memory instructions emitted by this
# toolchain unless extra feature flags are provided. Rust's size/LTO release
# profile still optimizes the checked-in browser binary deterministically.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
